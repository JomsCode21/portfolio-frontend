<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Jhumari Job Galos — MERN Stack Developer portfolio." />
    <meta property="og:title" content="Jhumari Job Galos | MERN Stack Developer" />
    <meta
      property="og:description"
      content="Modern full-stack web applications built with the MERN stack."
    />
    <meta name="theme-color" content="#0b1120" />
    <link rel="icon" href="/favicon.svg" />
    <title>Jhumari Job Galos | MERN Stack Developer</title>
    <script>
      (() => {
        const stored = localStorage.getItem('portfolio-theme');
        const theme =
          stored || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
